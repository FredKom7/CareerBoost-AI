{% extends "base.html" %}
{% block title %}CareerBoost AI | Upload Resume{% endblock %}

{% block content %}
<main>
  <section class="section glass reveal" style="margin-top: 2rem;">
    <h2>Upload Resume</h2>
    <p>Choose a PDF and target company, then run ATS analysis.</p>
    {% if status %}
      <p style="color:#ffb3c7;">{{ status[1] }}</p>
    {% endif %}
    <form method="post" enctype="multipart/form-data" id="resumeForm">
      <div class="grid-2">
        <div>
          <label for="resume">Resume PDF</label>
          <input id="resume" name="resume" type="file" accept=".pdf,application/pdf" required>
          <small id="filePreview">No file selected.</small>
        </div>
        <div>
          <label for="company">Target Company</label>
          <select id="company" name="company" required>
            <option value="">Select company</option>
            <option>Google</option>
            <option>Microsoft</option>
            <option>Amazon</option>
            <option>Meta</option>
            <option>Netflix</option>
            <option>Adobe</option>
          </select>
        </div>
      </div>
      <button class="btn primary" id="analyzeBtn" type="submit">
        <span>Analyze Resume</span>
        <span class="loader" aria-hidden="true"></span>
      </button>
    </form>
  </section>
</main>
{% endblock %}
